services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocery_price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery_price_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
